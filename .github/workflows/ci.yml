name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: No runtime dependencies, no install hooks
        run: node scripts/check-deps.js
      - run: npm run build
      # Explicit file list: Node 20 does not expand globs in --test and cmd.exe
      # does not expand them either, so a quoted pattern fails on Windows.
      - name: Unit and end-to-end tests
        run: >-
          node --test
          dist/test/decode.test.js
          dist/test/detectors.test.js
          dist/test/ledger.test.js
          dist/test/lock.test.js
          dist/test/proxy.test.js
      - name: Adversarial vectors
        run: node dist/src/index.js benchmark --iterations 200
      - name: Latency report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node dist/src/index.js benchmark --iterations 1000 --json benchmark.json
      - name: Upload benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
