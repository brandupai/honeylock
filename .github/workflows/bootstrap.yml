name: bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded archive over the repository root
        run: |
          set -euo pipefail
          test -f honeylock-v0.1.zip
          mkdir -p /tmp/unpack
          unzip -q honeylock-v0.1.zip -d /tmp/unpack
          cp -a /tmp/unpack/bastion/. .
          rm -f honeylock-v0.1.zip

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "honeylock bootstrap"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "chore: import honeylock v0.1 sources from the uploaded archive"
          git push
