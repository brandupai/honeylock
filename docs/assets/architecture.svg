<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="honeylock sits between an MCP client and an MCP server, with a process-local ledger">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B4632"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #E3D6BE; stroke-width: 1.5; rx: 10; }
      .inner { fill: #FDF8EE; stroke: #EFE3CC; stroke-width: 1; }
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1C1508; }
      .s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7A6748; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7A6748; }
      .edge { stroke: #5B4632; stroke-width: 1.6; fill: none; }
      .edgeDashed { stroke: #8b98a5; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1000" height="500" fill="#ffffff"/>

  <text class="label" x="40" y="40" font-size="12">request path, one stdio pipe</text>

  <!-- client -->
  <rect class="box" x="36" y="176" width="184" height="120"/>
  <text class="t" x="128" y="222" font-size="15" text-anchor="middle">MCP client</text>
  <text class="s" x="128" y="246" font-size="11" text-anchor="middle">agent, IDE, CLI</text>
  <text class="s" x="128" y="268" font-size="11" text-anchor="middle">decides the call</text>

  <!-- arrow client to honeylock -->
  <path class="edge" d="M 222 236 L 292 236" marker-end="url(#arrow)"/>
  <text class="label" x="257" y="220" font-size="10" text-anchor="middle">frames</text>

  <!-- honeylock -->
  <rect x="292" y="64" width="424" height="344" rx="14" fill="#FFFCF4" stroke="#9F5007" stroke-width="1.8"/>
  <text class="t" x="316" y="96" font-size="16">honeylock</text>
  <text class="s" x="316" y="118" font-size="11">proxy, zero runtime deps</text>

  <rect class="inner" x="312" y="134" width="384" height="52" rx="8"/>
  <text class="t" x="328" y="158" font-size="12">frame reader</text>
  <text class="s" x="328" y="176" font-size="10.5">newline framing, 1 MB cap, stdout clean</text>

  <rect class="inner" x="312" y="196" width="384" height="52" rx="8"/>
  <text class="t" x="328" y="220" font-size="12">pins</text>
  <text class="s" x="328" y="238" font-size="10.5">tools/list hashed, drift blocks the tool</text>

  <rect class="inner" x="312" y="258" width="384" height="52" rx="8"/>
  <text class="t" x="328" y="282" font-size="12">detectors</text>
  <text class="s" x="328" y="300" font-size="10.5">path, shell, sql, unicode, secrets, policy</text>

  <rect class="inner" x="312" y="320" width="384" height="52" rx="8"/>
  <text class="t" x="328" y="344" font-size="12">ledger</text>
  <text class="s" x="328" y="362" font-size="10.5">HMAC chain, written before the refusal</text>

  <!-- arrow honeylock to server -->
  <path class="edge" d="M 718 236 L 782 236" marker-end="url(#arrow)"/>
  <text class="label" x="750" y="220" font-size="10" text-anchor="middle">allowed</text>

  <!-- server -->
  <rect class="box" x="784" y="176" width="180" height="120"/>
  <text class="t" x="874" y="222" font-size="15" text-anchor="middle">MCP server</text>
  <text class="s" x="874" y="246" font-size="11" text-anchor="middle">tools, files, net</text>
  <text class="s" x="874" y="268" font-size="11" text-anchor="middle">untrusted by design</text>

  <!-- responses back -->
  <path class="edgeDashed" d="M 784 306 C 754 306 740 330 718 330" marker-end="url(#arrow)"/>
  <text class="label" x="752" y="352" font-size="10" text-anchor="middle">responses</text>

  <!-- refusal path -->
  <path class="edgeDashed" stroke="#b42318" d="M 292 330 C 262 330 246 300 224 300" marker-end="url(#arrowRed)"/>
  <text class="label" x="252" y="322" font-size="10" text-anchor="middle" fill="#b42318">refusal</text>
  <text class="label" x="252" y="338" font-size="10" text-anchor="middle" fill="#b42318">-32001</text>

  <!-- ledger file -->
  <rect class="box" x="420" y="424" width="180" height="46" rx="8"/>
  <text class="t" x="510" y="446" font-size="11.5" text-anchor="middle">.honeylock/ledger.jsonl</text>
  <text class="s" x="510" y="461" font-size="10" text-anchor="middle">verify recomputes the chain</text>
  <path class="edgeDashed" d="M 504 372 L 504 422" marker-end="url(#arrow)"/>

  <text class="label" x="36" y="446" font-size="10.5">The model is treated as untrusted: it can be steered by anything it reads.</text>
  <text class="label" x="36" y="462" font-size="10.5">Every decision is written to the ledger before the client hears back.</text>
</svg>
