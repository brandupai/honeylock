<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Pipeline latency by argument size, log scale">
  <defs>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1C1508; }
      .s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7A6748; }
      .grid { stroke: #EFE3CC; stroke-width: 1; }
    </style>
  </defs>

  <rect width="760" height="300" fill="#ffffff"/>

  <text class="t" x="170" y="28" font-size="13">pipeline latency by argument size</text>
  <text class="s" x="170" y="46" font-size="10.5">p50, log scale, Linux arm64, Node 24.21</text>

  <!-- grid -->
  <g>
    <line class="grid" x1="170" y1="58" x2="170" y2="252"/>
    <line class="grid" x1="322" y1="58" x2="322" y2="252"/>
    <line class="grid" x1="475" y1="58" x2="475" y2="252"/>
    <line class="grid" x1="627" y1="58" x2="627" y2="252"/>
    <line class="grid" x1="170" y1="252" x2="700" y2="252"/>
  </g>
  <g class="s" font-size="9.5" text-anchor="middle">
    <text x="170" y="268">10 µs</text>
    <text x="322" y="268">100 µs</text>
    <text x="475" y="268">1 ms</text>
    <text x="627" y="268">10 ms</text>
  </g>

  <!-- rows -->
  <g>
    <text class="s" x="24" y="88" font-size="11">1 KB</text>
    <rect x="170" y="74" width="39" height="26" fill="#9F5007" opacity="0.85"/>
    <text class="t" x="217" y="92" font-size="10.5">18 µs</text>

    <text class="s" x="24" y="138" font-size="11">100 KB</text>
    <rect x="170" y="124" width="296" height="26" fill="#9F5007" opacity="0.85"/>
    <text class="t" x="480" y="142" font-size="10.5">872 µs</text>

    <text class="s" x="24" y="188" font-size="11">1 MB</text>
    <rect x="170" y="174" width="449" height="26" fill="#C97A12" opacity="0.85"/>
    <text class="t" x="627" y="192" font-size="10.5">8.8 ms</text>

    <text class="s" x="24" y="238" font-size="11">1 MB base64</text>
    <rect x="170" y="224" width="516" height="26" fill="#b42318" opacity="0.85"/>
    <text class="t" x="694" y="242" font-size="10.5" text-anchor="end">24.3 ms</text>
  </g>

  <text class="s" x="170" y="284" font-size="9.5">Small frames are microseconds. Large payloads are not: no sub-millisecond claim.</text>
</svg>
