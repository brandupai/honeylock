<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Decision flow for one tools/call">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B4632"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1C1508; }
      .s { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7A6748; }
      .edge { stroke: #5B4632; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#ffffff"/>

  <!-- start -->
  <rect x="310" y="24" width="280" height="52" rx="10" fill="#FDF8EE" stroke="#E3D6BE" stroke-width="1.5"/>
  <text class="t" x="450" y="48" font-size="13" text-anchor="middle">tools/call arrives on stdin</text>
  <text class="s" x="450" y="66" font-size="10.5" text-anchor="middle">batch unpacked, each item on its own</text>

  <path class="edge" d="M 450 76 L 450 108" marker-end="url(#a)"/>

  <!-- validate -->
  <polygon points="450,110 590,166 450,222 310,166" fill="#ffffff" stroke="#E3D6BE" stroke-width="1.5"/>
  <text class="t" x="450" y="160" font-size="12.5" text-anchor="middle">valid frame,</text>
  <text class="t" x="450" y="178" font-size="12.5" text-anchor="middle">tool pinned?</text>

  <path class="edge" stroke="#b42318" d="M 590 166 L 706 166" marker-end="url(#ar)"/>
  <text class="s" x="648" y="156" font-size="10" text-anchor="middle" fill="#b42318">no</text>
  <rect x="708" y="140" width="166" height="52" rx="8" fill="#fff5f4" stroke="#e7b4ae" stroke-width="1.2"/>
  <text class="t" x="791" y="162" font-size="11.5" text-anchor="middle" fill="#b42318">block: not pinned</text>
  <text class="s" x="791" y="180" font-size="10" text-anchor="middle">changed or added tool</text>

  <path class="edge" d="M 450 222 L 450 252" marker-end="url(#a)"/>
  <text class="s" x="462" y="242" font-size="10">yes</text>

  <!-- detectors -->
  <rect x="290" y="254" width="320" height="86" rx="10" fill="#FDF8EE" stroke="#E3D6BE" stroke-width="1.5"/>
  <text class="t" x="450" y="280" font-size="13" text-anchor="middle">six detectors, pure functions</text>
  <text class="s" x="450" y="300" font-size="10.5" text-anchor="middle">decode to a canonical form, then match</text>
  <text class="s" x="450" y="318" font-size="10.5" text-anchor="middle">worst verdict wins: block &gt; review &gt; allow</text>

  <path class="edge" d="M 450 340 L 450 372" marker-end="url(#a)"/>

  <!-- verdict -->
  <polygon points="450,374 590,430 450,486 310,430" fill="#ffffff" stroke="#E3D6BE" stroke-width="1.5"/>
  <text class="t" x="450" y="436" font-size="12.5" text-anchor="middle">verdict</text>

  <!-- block -->
  <path class="edge" stroke="#b42318" d="M 590 430 L 706 430" marker-end="url(#ar)"/>
  <text class="s" x="648" y="420" font-size="10" text-anchor="middle" fill="#b42318">block</text>
  <rect x="708" y="404" width="166" height="52" rx="8" fill="#fff5f4" stroke="#e7b4ae" stroke-width="1.2"/>
  <text class="t" x="791" y="426" font-size="11.5" text-anchor="middle" fill="#b42318">error -32001</text>
  <text class="s" x="791" y="444" font-size="10" text-anchor="middle">not forwarded</text>

  <!-- review -->
  <path class="edge" stroke="#C97A12" d="M 450 486 L 450 518" marker-end="url(#a)"/>
  <text class="s" x="462" y="508" font-size="10" fill="#C97A12">review</text>
  <rect x="300" y="520" width="300" height="52" rx="10" fill="#fffaf0" stroke="#e8cfa4" stroke-width="1.2"/>
  <text class="t" x="450" y="542" font-size="11.5" text-anchor="middle" fill="#C97A12">no approver: denied</text>
  <text class="s" x="450" y="560" font-size="10" text-anchor="middle">--on-review allow logs and forwards instead</text>

  <!-- allow -->
  <path class="edge" stroke="#1a7f37" d="M 310 430 L 190 430" marker-end="url(#ag)"/>
  <text class="s" x="250" y="420" font-size="10" text-anchor="middle" fill="#1a7f37">allow</text>
  <rect x="24" y="404" width="166" height="52" rx="8" fill="#f2fbf4" stroke="#b6ddc0" stroke-width="1.2"/>
  <text class="t" x="107" y="426" font-size="11.5" text-anchor="middle" fill="#1a7f37">forward to server</text>
  <text class="s" x="107" y="444" font-size="10" text-anchor="middle">frame untouched</text>

  <text class="s" x="24" y="602" font-size="10">Every outcome, including allow, is appended to the ledger first. A detector that throws is a block, not a crash.</text>
</svg>
